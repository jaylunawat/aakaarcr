{% extends "portal/base.html" %}
{% block content %}<section class="max-w-xl mx-auto pixel bg-[#161822] p-8"><h1 class="text-3xl font-bold text-white">Choose a new password</h1>{% if validlink %}<form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.as_p }}<button class="pixel-button w-full bg-[#FFD026] py-3 text-black font-bold" type="submit">SAVE NEW PASSWORD</button></form>{% else %}<p class="mt-3 text-red-300">This reset link is no longer valid. Request a new one.</p>{% endif %}</section>{% endblock %}
