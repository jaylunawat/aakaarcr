{% extends "portal/base.html" %}
{% block title %}Reset password · Aakaar CR '26{% endblock %}
{% block content %}<section class="max-w-xl mx-auto pixel bg-[#161822] p-8"><p class="text-[#00FF66] text-xs">// ACCOUNT RECOVERY</p><h1 class="mt-3 text-3xl font-bold text-white">Reset your password</h1><p class="mt-3 text-gray-400">Enter the college email linked to your CR account. We will send a secure reset link.</p><form method="post" class="mt-6 space-y-4">{% csrf_token %}<label class="block text-sm">College email{{ form.email }}{% for error in form.email.errors %}<span class="text-red-300">{{ error }}</span>{% endfor %}</label><button class="pixel-button w-full bg-[#FFD026] py-3 text-black font-bold" type="submit">SEND RESET LINK</button></form></section>{% endblock %}
